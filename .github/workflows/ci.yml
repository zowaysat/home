# 质量门禁：lint + 单测 + 构建（替代旧版“仅构建”的 build.yml）
name: CI

on:
  push:
    branches:
      - dev
      - master
  pull_request:
  workflow_dispatch:

# 同一分支只保留最新一次运行，避免排队浪费
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint / Test / Build
    # 固定在 Playwright / GitHub Actions 官方支持的 Ubuntu LTS，避免 ubuntu-latest 迁移带来环境漂移
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 构建期 env 校验要求 .env 存在：CI 从模板复制，不依赖仓库提交密钥
      - name: Prepare env file
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: home-dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare env file
        run: cp .env.example .env

      - name: Install Chromium
        # 网络/apt 偶发失败时重试，避免 e2e 因下载波动红掉
        run: |
          for i in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then
              break
            fi
            if [ "$i" = "3" ]; then
              exit 1
            fi
            echo "Playwright install failed (attempt $i), retrying in 10s..."
            sleep 10
          done

      # webServer 会自行执行 pnpm build + pnpm preview
      - name: Run e2e smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
