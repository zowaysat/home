name: Release

# 打 v* tag 时自动构建并发布静态产物（dist）到 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare env file
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package dist
        run: |
          cd dist
          zip -r ../home-dist.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: home-dist.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: home-dist
          path: dist
          retention-days: 7
