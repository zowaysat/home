# 静态站点 nginx 配置（配合 docker 运行时使用）
# 由 vite-plugin-compression 生成 .gz 文件，开启 gzip_static 后直接复用

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩（非预压缩资源）
    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               application/manifest+json image/svg+xml text/plain;

    # 带 hash 的构建产物：长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 图片 / 字体：30 天缓存
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML / Service Worker / manifest 不缓存：保证发版后能拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA 回退（本站为单页，实际只有 / 一个入口）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
